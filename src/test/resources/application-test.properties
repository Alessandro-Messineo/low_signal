spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.sql.init.mode=never

jwt.secret=testSecretKeyForTestingPurposesOnly1234567890123456
jwt.expiration=900000
jwt.refresh-expiration=604800000

app.cookie.secure=false
app.cookie.same-site=Lax
FRONTEND_URL=http://localhost:3000

# Logging: silenzia Hibernate e Spring, mostra solo test
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.boot.test.context.SpringBootTestContextBootstrapper=WARN
logging.level.org.springframework.test.context.cache=WARN
logging.level.org.springframework.boot.SpringApplication=WARN
logging.level.org.springframework.boot.devtools=WARN
logging.level.org.springframework.data.repository.config=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

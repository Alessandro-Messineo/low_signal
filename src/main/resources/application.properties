spring.application.name=low_signal

# Hibernate ddl auto (create, create-drop, validate, update, none)
spring.jpa.hibernate.ddl-auto=update

# Silenzia i log di creazione tabelle/relazioni (DDL) di Hibernate
logging.level.org.hibernate.tool.schema=OFF

# Silenzia le query SQL eseguite da Hibernate
logging.level.org.hibernate.SQL=OFF

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =====================
# JWT Configuration
# =====================


spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

spring.sql.init.mode=always

spring.jpa.defer-datasource-initialization=true


# Frontend origin (CORS). In prod va impostata l'URL reale del frontend.
FRONTEND_URL=${FRONTEND_URL:http://localhost:3000}

# Cookie di sessione (refresh token)
app.cookie.secure=${COOKIE_SECURE}
app.cookie.same-site=${COOKIE_SAME_SITE}

# =====================
# Stripe 
# =====================
# Difesa 1: se STRIPE_SECRET_KEY non inizia con "sk_test_" l'app NON parte.
# Prendi le chiavi di TEST dal dashboard Stripe (modalita' test).
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.currency=${STRIPE_CURRENCY}
# Difesa 2: l'unica modalita' accettata e' "test"
stripe.mode=${STRIPE_MODE}

# Ordine non pagato: dopo N minuti viene annullato e lo stock torna disponibile
app.payment.expiry-minutes=${PAYMENT_EXPIRY_MINUTES}
app.payment.expiry-enabled=${PAYMENT_EXPIRY_ENABLED}
app.payment.expiry-delay-ms=300000
app.payment.expiry-initial-delay-ms=300000

spring.sql.init.separator=^^